name: CI

on: [pull_request]

jobs:
  lint:
    name: Lint (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint only the files this PR changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/*.mjs' > changed.txt
          node scripts/lint-changed.mjs changed.txt
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test test/*.test.mjs
  smoke:
    # Opt-in fixture: runs only while the repository variable CI_FIXTURE_SMOKE is "1", so an
    # unrelated pull request never inherits a red check it cannot clear.
    name: E2E smoke
    if: vars.CI_FIXTURE_SMOKE == '1'
    runs-on: ubuntu-latest
    steps:
      - name: deterministic smoke failure (fixture)
        run: |
          echo "browser session lost (fixture: fails on purpose)"
          exit 1

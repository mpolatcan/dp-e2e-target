name: CI provider error

# Fixture: this workflow cannot start, because the reusable workflow it calls does not exist.
# GitHub reports the run as a startup failure before any step executes, which is the
# pre-execution provider error shape. Scoped to "feature/CIINFRA" branches only.
on: [pull_request]

jobs:
  broken:
    name: Provider startup
    if: startsWith(github.head_ref, 'feature/CIINFRA')
    uses: ./.github/workflows/this-workflow-does-not-exist.yml
